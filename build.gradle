plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

group = 'com.lord_09mayhem'
version = '1.0.0'

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.7"
    mappings "net.fabricmc:yarn:1.21.7+build.1:v2"

    modImplementation "net.fabricmc.fabric-loader:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.146.3+1.21"
}

loom {
    splitEnvironmentSourceSets()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
