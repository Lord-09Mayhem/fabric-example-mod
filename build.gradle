plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'  // use the loom_version from the site
    id 'java'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.7"
    mappings "net.fabricmc:yarn:1.21.7+build.8:v2"

    modImplementation "net.fabricmc.fabric-loader:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.7"
}

minecraft {
    // no special config needed here, remove if empty
}
