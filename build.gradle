plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT' // Stable Loom that works with 1.21.7
    id 'java'
}

group = 'com.example'
version = '1.0.0'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:1.21.7"
    mappings "net.fabricmc:yarn:1.21.7+build.8:v2"

    // Fabric Loader + API
    modImplementation "net.fabricmc.fabric-loader:fabric-loader:0.15.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.7"
}
