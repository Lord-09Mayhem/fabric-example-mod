plugins {
    id 'fabric-loom' version '1.5.8'
    id 'java'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.7"
    mappings "net.fabricmc:yarn:1.21.7+build.5:v2"

    modImplementation "net.fabricmc.fabric-loader:fabric-loader:0.16.12"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.146.2+1.21.7"
}

minecraft {
    // any minecraft extension config if needed
}

