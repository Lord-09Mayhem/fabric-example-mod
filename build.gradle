plugins {
    id 'fabric-loom' version '1.11.4'
    id 'java'
}

group = 'com.example'
version = '1.0.0'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.7"
    mappings "net.fabricmc:yarn:1.21.7+build.8:v2"

    modImplementation "net.fabricmc.fabric-loader:fabric-loader:0.16.12"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.7"
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}
